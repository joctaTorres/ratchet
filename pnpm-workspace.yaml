packages:
  - '.'
# esbuild ships a postinstall that fetches its native binary; pnpm 11 denies
# build scripts by default and exits non-zero (ERR_PNPM_IGNORED_BUILDS) until the
# dependency is explicitly allowed. esbuild is required by build.js, so allow it.
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
verifyDepsBeforeRun: false
# Security remediation: force transitive dev-dependency ranges up to the patched
# versions for every "high" advisory the dependency-audit gate flags. Each pin is
# keyed by major so a single entry covers that major's whole vulnerable range:
#   brace-expansion  DoS via unbounded expansion + the follow-up bypass of the
#                    CVE-2026-14257 mitigation (patched in 1.1.18 / 2.1.4 / 5.0.9),
#                    then uncontrolled recursion in parseComm and on nested
#                    braces (patched in 1.1.20 / 2.1.6 / 5.0.11)
#   js-yaml          quadratic CPU in !!omap resolution (fixed in 4.3.1), plus
#                    empty merge sources bypassing maxTotalMergeKeys
#                    (GHSA-2883-xcg3-v3hh, patched in 4.3.2)
#   nanoid           non-secure/custom generators loop forever on negative or
#                    zero size (patched in 3.3.18)
#   postcss          path traversal in sourceMappingURL auto-loading, plus the
#                    incomplete-fix follow-up when `from` is unset (8.5.23)
#   source-map-js    event-loop DoS through crafted mappings (patched in 1.2.2)
#   tinypool         critical prototype-pollution gadgets to RCE in worker
#                    options and run() options (GHSA-5gmw-xhrv-c9v3,
#                    GHSA-85c8-ppgw-ccpr; patched only in 2.1.2). vitest 3
#                    declares tinypool ^1.1.1, so the 1.x line is lifted to 2.x;
#                    tinypool 2 keeps the Tinypool API vitest 3 calls.
# braces (GHSA-vfj7-8cjw-p6xm) has no patched release; it is removed from the
# tree instead by replacing fast-glob (fast-glob > micromatch > braces) with
# tinyglobby, which matches through picomatch and never pulls braces.
# These supersede an earlier round of pins for the same packages: new advisories
# widened the vulnerable ranges past the versions previously pinned here.
overrides:
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  js-yaml@4: 4.3.2
  nanoid@3: 3.3.18
  postcss@8: 8.5.23
  source-map-js@1: 1.2.2
  tinypool@1: 2.2.0
